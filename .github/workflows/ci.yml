name: CI and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  console:
    name: Console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: any
          cache: true
      - name: Install locked dependencies
        working-directory: apps/console
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: apps/console
        run: flutter analyze --no-pub
      - name: Test
        working-directory: apps/console
        run: flutter test --no-pub

  native:
    name: ${{ matrix.platform.target }} / CPU + GPU
    needs: console
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD_TARGET: ${{ matrix.platform.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: any
          cache: true
      - name: Build console for embedding
        working-directory: apps/console
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --wasm --release --no-pub
      - name: Prune embedded console
        run: bash scripts/prune_web_release.sh apps/console/build/web
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add "$BUILD_TARGET"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.platform.target }}-combined
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint and test
        run: |
          cargo check --locked --workspace --all-targets --target "$BUILD_TARGET"
          cargo clippy --locked --workspace --all-targets --target "$BUILD_TARGET" --features gpu -- -D warnings
          cargo test --locked --workspace --target "$BUILD_TARGET" --features gpu
      - name: Build native release binary with both backends
        run: cargo build --locked --release -p privacy-router --target "$BUILD_TARGET" --features gpu
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Smoke test and stage executable
        run: python scripts/package_release.py --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform.target }}-combined
          path: dist/privacy-router-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify version and publish executables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/package_release.py --verify-release "$RELEASE_TAG"
          cd dist
          # Stage every asset in a draft; publish only after the upload succeeds.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ../docs/releases.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./privacy-router-* --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
